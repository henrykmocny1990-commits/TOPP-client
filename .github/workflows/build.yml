name: Build TOPP Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack project
        run: unzip TOPP-Client-source.zip -d project

      - name: Build TOPP
        run: gradle -p project/TOPP-Client build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TOPP-Client-JAR
          path: project/TOPP-Client/build/libs/*.jar 
